[project]
name = "customer-intelligence"
version = "0.1.0"
description = "Customer Intelligence & Decision Analytics — a synthetic, end-to-end analytics product from raw data to recommended action."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
